version: '3.8'

services:
  # 1. Frontend Web App (Nginx SPA)
  ta3-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ta3_frontend_app
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Local PostgreSQL Database Engine (Development & Offline Testing)
  ta3-postgres:
    image: postgres:15-alpine
    container_name: ta3_postgres_db
    environment:
      POSTGRES_DB: ta3_lms
      POSTGRES_USER: ta3_admin
      POSTGRES_PASSWORD: ta3_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    restart: always

volumes:
  pgdata:
    driver: local
