apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta3-frontend-deployment
  namespace: ta3-production
  labels:
    app: ta3-frontend
    tier: presentation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ta3-frontend
  template:
    metadata:
      labels:
        app: ta3-frontend
    spec:
      containers:
      - name: ta3-frontend
        image: ghcr.io/ta3allam/ta3-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 101

---
apiVersion: v1
kind: Service
metadata:
  name: ta3-frontend-service
  namespace: ta3-production
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: ta3-frontend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ta3-frontend-hpa
  namespace: ta3-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ta3-frontend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
